name: Publish package repositories

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Existing GitHub release tag to publish
        required: true
        type: string
      channel:
        description: Package repository channel
        required: true
        default: preview
        type: choice
        options:
          - preview
          - stable

permissions:
  contents: read

concurrency:
  group: package-repositories
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download release packages
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          mkdir -p dist
          gh release download "$RELEASE_TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --dir dist \
            --pattern '*.deb' \
            --pattern '*.rpm'

      - name: Install repository tooling
        run: |
          sudo apt-get update
          sudo apt-get install --yes \
            apt-utils \
            createrepo-c \
            dpkg-dev \
            gnupg \
            rpm

      - name: Import package signing key
        env:
          PACKAGES_GPG_PRIVATE_KEY: ${{ secrets.PACKAGES_GPG_PRIVATE_KEY }}
        run: |
          test -n "$PACKAGES_GPG_PRIVATE_KEY"
          printf '%s' "$PACKAGES_GPG_PRIVATE_KEY" | gpg --batch --import

      - name: Publish package repositories
        env:
          CF_R2_ACCOUNT_ID: ${{ secrets.CF_R2_ACCOUNT_ID }}
          CF_R2_ACCESS_KEY_ID: ${{ secrets.CF_R2_ACCESS_KEY_ID }}
          CF_R2_SECRET_ACCESS_KEY: ${{ secrets.CF_R2_SECRET_ACCESS_KEY }}
          CF_R2_BUCKET: ${{ secrets.CF_R2_BUCKET }}
        run: |
          scripts/sync-package-repositories.sh \
            dist \
            "${{ inputs.channel }}" \
            "$RUNNER_TEMP/wipeme-packages"
