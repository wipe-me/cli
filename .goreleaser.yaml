version: 2

project_name: wipeme

builds:
  - id: wipeme
    main: ./cmd/wipeme
    binary: wipeme
    env:
      - CGO_ENABLED=0
    flags:
      - -trimpath
    ldflags:
      - -s -w -X main.version={{.Version}}
    goos:
      - darwin
      - linux
    goarch:
      - amd64
      - arm64

archives:
  - id: archives
    formats:
      - tar.gz
    name_template: >-
      {{ .ProjectName }}_
      {{- title .Os }}_
      {{- if eq .Arch "amd64" }}x86_64
      {{- else if eq .Arch "arm64" }}arm64
      {{- else }}{{ .Arch }}{{ end }}

nfpms:
  - id: linux-packages
    package_name: wipeme
    ids:
      - wipeme
    vendor: Wipe.me
    homepage: https://wipe.me
    maintainer: Wipe.me <v@swap.io>
    description: Create private, one-time wipe.me links from your terminal.
    license: Apache-2.0
    section: utils
    priority: optional
    bindir: /usr/bin
    formats:
      - deb
      - rpm
    contents:
      - src: LICENSE
        dst: /usr/share/doc/wipeme/LICENSE
      - src: README.md
        dst: /usr/share/doc/wipeme/README.md
    rpm:
      group: Applications/Internet

homebrew_casks:
  - name: wipeme
    ids:
      - archives
    binaries:
      - wipeme
    homepage: https://wipe.me
    description: Create private, one-time wipe.me links from your terminal
    directory: Casks
    skip_upload: auto
    repository:
      owner: wipe-me
      name: homebrew-tap
      branch: main
      token: "{{ .Env.HOMEBREW_TAP_GITHUB_TOKEN }}"
    commit_author:
      name: wipe-me release bot
      email: v@swap.io

checksum:
  name_template: checksums.txt
  algorithm: sha256

release:
  prerelease: auto

changelog:
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^test:"
